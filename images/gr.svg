<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="rounded-flag">
      <rect x="1.5" y="1.5" width="197" height="197" rx="18.5" ry="18.5" />
    </clipPath>
  </defs>
  <g clip-path="url(#rounded-flag)">
    <!-- Solid Navy Blue Background (#002647) -->
    <rect width="200" height="200" fill="#002647" />

    <!-- Flag White Elements (#e5e5e5) -->
    <!-- Stripe 1 (top-right) -->
    <rect x="100" y="21.5" width="100" height="22.5" fill="#e5e5e5" />

    <!-- Canton horizontal cross arm -->
    <rect x="0" y="44" width="100" height="22.5" fill="#e5e5e5" />

    <!-- Stripe 3 (mid-right) -->
    <rect x="100" y="66.5" width="100" height="22.5" fill="#e5e5e5" />

    <!-- Canton vertical cross arm -->
    <rect x="32.5" y="-1" width="22.5" height="113" fill="#e5e5e5" />

    <!-- Stripe 5 (full width) -->
    <rect x="0" y="111.5" width="200" height="22.5" fill="#e5e5e5" />

    <!-- Stripe 7 (full width) -->
    <rect x="0" y="156.5" width="200" height="22.5" fill="#e5e5e5" />
  </g>
</svg>
