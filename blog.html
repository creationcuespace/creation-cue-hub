<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net https://creationcue.space https://via.placeholder.com https://wsrv.nl https://*.googleusercontent.com https://raw.githubusercontent.com https://*.githubusercontent.com; connect-src 'self' https://raw.githubusercontent.com wss://*.firebasedatabase.app https://*.firebasedatabase.app https://*.googleapis.com https://identitytoolkit.googleapis.com https://www.google.com/recaptcha/ https://ntfy.sh https://corsproxy.io https://api.allorigins.win; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://*.firebasedatabase.app https://www.google.com/recaptcha/ https://recaptcha.net/;">
    
    <title>CreationCue™ Blog | Wear OS Smartwatch News & Guides</title>
    <meta name="description" content="Stay up-to-date with Wear OS news, smartwatch tips, installation guides, and premium watch face releases from CreationCue.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creationcuespace.github.io/creation-cue-hub/blog.html">
    
    <!-- OG Meta -->
    <meta property="og:title" content="CreationCue™ Blog | Wear OS Smartwatch News & Guides">
    <meta property="og:description" content="Stay up-to-date with Wear OS news, smartwatch tips, installation guides, and premium watch face releases.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creationcuespace.github.io/creation-cue-hub/blog.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/creationcuespace/creation-cue-hub@main/images/logo.png">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* HSL tailored color palette matching main app */
            --bg-color: hsl(240, 10%, 3%);
            --surface-color: hsl(240, 10%, 7%);
            --surface-hover: hsl(240, 10%, 12%);
            --surface-variant: hsl(240, 5%, 15%);
            
            --primary: hsl(43, 89%, 53%);      /* Custom Gold #f1b31c */
            --primary-glow: hsla(43, 89%, 53%, 0.15);
            --primary-text: hsl(43, 89%, 60%);
            
            --text-primary: hsl(0, 0%, 100%);
            --text-secondary: hsl(240, 5%, 70%);
            --text-muted: hsl(240, 5%, 45%);
            
            --border-color: hsla(0, 0%, 100%, 0.08);
            
            --glass-bg: rgba(15, 15, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: rgba(0, 0, 0, 0.5);
            
            --font-main: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* Top Brand Header */
        .top-brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s ease;
        }
        .brand-logo-area:hover {
            opacity: 0.85;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--primary);
        }

        .hub-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--surface-color);
        }
        .hub-link:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--surface-hover);
        }

        /* Container Layout */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .blog-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .blog-header h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .blog-header h1 span {
            color: var(--primary);
        }

        .blog-header p {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Article Grid */
        .article-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .article-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            display: flex;
            box-shadow: 0 8px 24px var(--glass-shadow);
            transition: var(--transition-smooth);
            text-decoration: none;
            color: inherit;
        }

        .article-card:hover {
            border-color: rgba(241, 179, 28, 0.3);
            transform: translateY(-2px);
        }

        .article-thumb-container {
            width: 260px;
            min-height: 180px;
            position: relative;
            flex-shrink: 0;
            background: #111;
        }

        .article-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-details {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .article-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
        }

        .article-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 12px;
            transition: color 0.2s;
        }

        .article-card:hover .article-title {
            color: var(--primary);
        }

        .article-excerpt {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-blog {
            text-align: center;
            padding: 48px;
            background: var(--glass-bg);
            border: 1px dashed var(--border-color);
            border-radius: var(--border-radius-lg);
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--surface-color);
        }

        @media (max-width: 768px) {
            .article-card {
                flex-direction: column;
            }
            .article-thumb-container {
                width: 100%;
                height: 200px;
            }
            .article-details {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Persistent Header -->
    <header class="top-brand-header">
        <a href="index.html" class="brand-logo-area">
            <img src="https://wsrv.nl/?url=https://cdn.jsdelivr.net/gh/creationcuespace/creation-cue-hub@main/images/logo.png&w=64&output=webp" width="32" height="32" class="brand-logo" alt="Logo">
            <span class="brand-name">Creation<span>Cue</span>™</span>
        </a>
        <a href="index.html" class="hub-link">Back to Hub</a>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <div class="blog-header">
            <h1>Wear OS <span>News & Guides</span></h1>
            <p>Tips, custom layout guides, and recent updates from CreationCue Watch Face design lab.</p>
        </div>

        <div class="article-grid" id="blog-posts-container">
            <!-- Loading Indicator -->
            <div class="empty-blog" id="blog-loader">Loading articles...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 CreationCue. All rights reserved. Smartwatch designs and Wear OS news hub.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadBlogPosts();
        });

        async function loadBlogPosts() {
            const container = document.getElementById('blog-posts-container');
            if (!container) return;

            try {
                // Fetch the posts.json registry
                const response = await fetch('blog/posts.json?v=' + Date.now());
                if (!response.ok) {
                    throw new Error('No articles registry found.');
                }
                const posts = await response.json();

                if (!posts || posts.length === 0) {
                    container.innerHTML = '<div class="empty-blog">Check back soon! We are drafting new guides and updates.</div>';
                    return;
                }

                // Sort posts by date (newest first)
                const sortedPosts = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));

                container.innerHTML = '';
                sortedPosts.forEach(post => {
                    // Create optimized thumbnail URL
                    const thumbImg = post.thumbnail 
                        ? `https://wsrv.nl/?url=${encodeURIComponent(post.thumbnail)}&w=400&h=280&fit=cover&output=webp&q=80`
                        : 'https://raw.githubusercontent.com/creationcuespace/creation-cue-hub/main/images/ccBanner1.webp';

                    const card = document.createElement('a');
                    card.className = 'article-card';
                    card.href = `blog/${post.slug}.html`;
                    card.innerHTML = `
                        <div class="article-thumb-container">
                            <img class="article-thumb" src="${thumbImg}" alt="${post.title}" loading="lazy">
                        </div>
                        <div class="article-details">
                            <div class="article-meta">
                                <span>${post.date}</span>
                                <span>•</span>
                                <span>${post.readTime || '3 min'} Read</span>
                            </div>
                            <h2 class="article-title">${post.title}</h2>
                            <p class="article-excerpt">${post.excerpt || ''}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.warn('Error loading blog posts:', err);
                container.innerHTML = '<div class="empty-blog">No articles published yet. Check back soon!</div>';
            }
        }
    </script>
</body>
</html>
