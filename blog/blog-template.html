<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net https://creationcue.space https://via.placeholder.com https://wsrv.nl https://*.googleusercontent.com https://raw.githubusercontent.com https://*.githubusercontent.com; connect-src 'self' https://raw.githubusercontent.com wss://*.firebasedatabase.app https://*.firebasedatabase.app https://*.googleapis.com https://identitytoolkit.googleapis.com https://www.google.com/recaptcha/ https://ntfy.sh https://corsproxy.io https://api.allorigins.win; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://*.firebasedatabase.app https://www.google.com/recaptcha/ https://recaptcha.net/;">
    
    <title>{{BLOG_META_TITLE}}</title>
    <meta name="description" content="{{BLOG_META_DESCRIPTION}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{BLOG_CANONICAL_URL}}">
    
    <!-- OG Meta -->
    <meta property="og:title" content="{{BLOG_OG_TITLE}}">
    <meta property="og:description" content="{{BLOG_OG_DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{BLOG_CANONICAL_URL}}">
    <meta property="og:image" content="{{BLOG_OG_IMAGE}}">
    
    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{BLOG_OG_TITLE}}">
    <meta name="twitter:description" content="{{BLOG_OG_DESCRIPTION}}">
    <meta name="twitter:image" content="{{BLOG_OG_IMAGE}}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/creationcuespace/creation-cue-hub@main/images/logo.png">
    
    <!-- Performance: Early connection to image CDN & Preloads -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    
    <style>
        :root {
            /* HSL tailored color palette matching main app */
            --bg-color: hsl(240, 10%, 3%);
            --surface-color: hsl(240, 10%, 7%);
            --surface-hover: hsl(240, 10%, 12%);
            --surface-variant: hsl(240, 5%, 15%);
            
            --primary: hsl(43, 89%, 53%);      /* Custom Gold #f1b31c */
            --primary-glow: hsla(43, 89%, 53%, 0.15);
            --primary-text: hsl(43, 89%, 60%);
            
            --text-primary: hsl(0, 0%, 100%);
            --text-secondary: hsl(240, 5%, 70%);
            --text-muted: hsl(240, 5%, 45%);
            
            --border-color: hsla(0, 0%, 100%, 0.08);
            
            --glass-bg: rgba(15, 15, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: rgba(0, 0, 0, 0.5);
            
            --font-main: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        /* Top Brand Header */
        .top-brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s ease;
        }
        .brand-logo-area:hover {
            opacity: 0.85;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--primary);
        }

        .home-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--surface-color);
        }
        .home-link:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--surface-hover);
        }

        /* Container Layout */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Article Styles */
        article {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 32px;
            box-shadow: 0 8px 32px var(--glass-shadow);
            margin-bottom: 32px;
        }

        .post-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .post-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .post-content {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .post-content p {
            margin-bottom: 20px;
        }

        .post-content h2 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 32px 0 16px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .post-content ul, .post-content ol {
            margin: 0 0 24px 24px;
        }

        .post-content li {
            margin-bottom: 8px;
        }

        .post-content strong {
            color: var(--text-primary);
        }

        .post-content blockquote {
            border-left: 3px solid var(--primary);
            background: rgba(241, 179, 28, 0.05);
            padding: 12px 20px;
            margin: 0 0 24px 0;
            border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;
            font-style: italic;
        }

        /* Sources Section */
        .sources-section {
            margin-top: 32px;
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .sources-section a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .sources-section a:hover {
            text-decoration: underline;
        }

        /* Watch Face Promo Section */
        .promo-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            box-shadow: 0 8px 32px var(--glass-shadow);
        }

        .related-section-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Carousel Styles */
        .related-slider-container {
            overflow-x: auto;
            display: flex;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface-variant) var(--bg-color);
        }

        .related-slider-container::-webkit-scrollbar {
            height: 6px;
        }
        .related-slider-container::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        .related-slider-container::-webkit-scrollbar-thumb {
            background: var(--surface-variant);
            border-radius: 3px;
        }

        .related-card {
            background: var(--surface-variant);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 12px;
            width: 130px;
            flex-shrink: 0;
            cursor: pointer;
            text-align: center;
            transition: var(--transition-smooth);
            text-decoration: none;
            display: block;
        }

        .related-card:hover {
            border-color: var(--primary);
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .related-card-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: block;
        }

        .related-card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .related-card-badge {
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 2px;
        }

        .related-card-badge.new {
            background: var(--primary);
            color: #000;
        }

        .related-card-badge.updated {
            background: #10B981;
            color: #000;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--surface-color);
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 16px 12px;
            }
            article {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Persistent Header -->
    <header class="top-brand-header">
        <a href="../index.html" class="brand-logo-area">
            <img src="https://wsrv.nl/?url=https://cdn.jsdelivr.net/gh/creationcuespace/creation-cue-hub@main/images/logo.png&w=64&output=webp" width="32" height="32" class="brand-logo" alt="Logo">
            <span class="brand-name">Creation<span>Cue</span>™</span>
        </a>
        <a href="../index.html" class="home-link">Back to Hub</a>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Blog Post -->
        <article>
            <div class="post-meta">
                <span>Published: {{BLOG_DATE}}</span>
                <span>•</span>
                <span>{{BLOG_READ_TIME}} Read</span>
            </div>
            
            <h1 class="post-title">{{BLOG_TITLE}}</h1>
            
            <div class="post-content">
                {{BLOG_CONTENT}}
            </div>
            
            <div class="sources-section">
                <strong>News Sources:</strong> {{BLOG_SOURCES}}
            </div>
        </article>

        <!-- Dynamic Conversion Carousel -->
        <section class="promo-section">
            <h3 class="related-section-title">Fresh Releases & Recent Updates</h3>
            <div class="related-slider-container" id="blog-carousel-slider">
                <!-- Carousel items dynamically generated by blog-carousel.js -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 CreationCue. All rights reserved. Smartwatch designs and Wear OS news hub.
    </footer>

    <!-- Carousel Javascript loader -->
    <script src="blog-carousel.js"></script>
</body>
</html>
