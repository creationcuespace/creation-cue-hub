<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net https://creationcue.space https://via.placeholder.com https://wsrv.nl https://*.googleusercontent.com https://raw.githubusercontent.com https://*.githubusercontent.com; connect-src 'self' https://raw.githubusercontent.com wss://*.firebasedatabase.app https://*.firebasedatabase.app https://*.googleapis.com https://identitytoolkit.googleapis.com https://www.google.com/recaptcha/ https://ntfy.sh https://corsproxy.io https://api.allorigins.win; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://*.firebasedatabase.app https://www.google.com/recaptcha/ https://recaptcha.net/;">
    
    <title>CreationCue™ Blog | Wear OS Smartwatch News</title>
    <meta name="description" content="Stay up-to-date with Wear OS news, smartwatch tips, and premium watch face releases.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" id="canonical-link" href="https://creationcue.web.app/blog/post.html">
    
    <!-- OG Meta -->
    <meta property="og:title" id="og-title" content="CreationCue™ Blog">
    <meta property="og:description" id="og-desc" content="Stay up-to-date with Wear OS news, smartwatch tips, and premium watch face releases.">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://raw.githubusercontent.com/creationcuespace/creation-cue-hub/main/images/ccBanner1.webp">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/creationcuespace/creation-cue-hub@main/images/logo.png">
    
    <!-- Performance preloads -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --bg-color: hsl(240, 10%, 3%);
            --surface-color: hsl(240, 10%, 7%);
            --surface-hover: hsl(240, 10%, 12%);
            --surface-variant: hsl(240, 5%, 15%);
            
            --primary: hsl(43, 89%, 53%);      /* Custom Gold #f1b31c */
            --primary-glow: hsla(43, 89%, 53%, 0.15);
            
            --text-primary: hsl(0, 0%, 100%);
            --text-secondary: hsl(240, 5%, 70%);
            --text-muted: hsl(240, 5%, 45%);
            
            --border-color: hsla(0, 0%, 100%, 0.08);
            
            --glass-bg: rgba(15, 15, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: rgba(0, 0, 0, 0.5);
            
            --font-main: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        .top-brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--primary);
        }

        .home-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--surface-color);
        }
        .home-link:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--surface-hover);
        }

        .main-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        article {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 32px;
            box-shadow: 0 8px 32px var(--glass-shadow);
            margin-bottom: 32px;
        }

        .post-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .post-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .post-content {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .post-content p {
            margin-bottom: 20px;
        }

        .post-content h2 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 32px 0 16px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .post-content ul, .post-content ol {
            margin: 0 0 24px 24px;
        }

        .post-content li {
            margin-bottom: 8px;
        }

        .post-content strong {
            color: var(--text-primary);
        }

        .post-content blockquote {
            border-left: 3px solid var(--primary);
            background: rgba(241, 179, 28, 0.05);
            padding: 12px 20px;
            margin: 0 0 24px 0;
            border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;
            font-style: italic;
        }

        .sources-section {
            margin-top: 32px;
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .sources-section a {
            color: var(--primary);
            text-decoration: none;
        }
        .sources-section a:hover {
            text-decoration: underline;
        }

        .promo-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            box-shadow: 0 8px 32px var(--glass-shadow);
        }

        .related-section-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .related-slider-container {
            overflow-x: auto;
            display: flex;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }

        .related-slider-container::-webkit-scrollbar {
            height: 6px;
        }
        .related-slider-container::-webkit-scrollbar-thumb {
            background: var(--surface-variant);
            border-radius: 3px;
        }

        .related-card {
            background: var(--surface-variant);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 12px;
            width: 130px;
            flex-shrink: 0;
            text-align: center;
            transition: var(--transition-smooth);
            text-decoration: none;
            display: block;
        }

        .related-card:hover {
            border-color: var(--primary);
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .related-card-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: block;
        }

        .related-card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .related-card-badge {
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 2px;
        }

        .related-card-badge.new {
            background: var(--primary);
            color: #000;
        }

        .related-card-badge.updated {
            background: #10B981;
            color: #000;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--surface-color);
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 16px 12px;
            }
            article {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <header class="top-brand-header">
        <a href="../index.html" class="brand-logo-area">
            <img src="https://wsrv.nl/?url=https://cdn.jsdelivr.net/gh/creationcuespace/creation-cue-hub@main/images/logo.png&w=64&output=webp" width="32" height="32" class="brand-logo" alt="Logo">
            <span class="brand-name">Creation<span>Cue</span>™</span>
        </a>
        <a href="../blog.html" class="home-link">Back to Blog</a>
    </header>

    <div class="main-container">
        <article>
            <div class="post-meta">
                <span id="post-date">Loading...</span>
                <span>•</span>
                <span id="post-readtime">Loading...</span>
            </div>
            
            <h1 class="post-title" id="post-title">Loading Article...</h1>
            
            <div class="post-content" id="post-content">
                <p>Loading article content...</p>
            </div>
            
            <div class="sources-section" id="post-sources-container" style="display:none;">
                <strong>News Sources:</strong> <span id="post-sources"></span>
            </div>
        </article>

        <section class="promo-section">
            <h3 class="related-section-title">Fresh Releases & Recent Updates</h3>
            <div class="related-slider-container" id="blog-carousel-slider">
                <!-- Carousel loaded dynamically -->
            </div>
        </section>
    </div>

    <footer>
        &copy; 2026 CreationCue. All rights reserved. Smartwatch designs and Wear OS news hub.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMarkdownArticle();
        });

        async function loadMarkdownArticle() {
            const titleEl = document.getElementById('post-title');
            const contentEl = document.getElementById('post-content');
            const dateEl = document.getElementById('post-date');
            const readTimeEl = document.getElementById('post-readtime');
            const sourcesContainer = document.getElementById('post-sources-container');
            const sourcesEl = document.getElementById('post-sources');

            // 1. Get post ID from query parameter: post.html?id=new-wear-os-upgrades
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                titleEl.textContent = 'Article Not Found';
                contentEl.innerHTML = '<p>No article ID was specified in the URL. Please return to the <a href="../blog.html">Blog index</a>.</p>';
                return;
            }

            try {
                // 2. Fetch metadata from posts.json to display date and read time
                let postMeta = null;
                try {
                    const registryRes = await fetch('posts.json');
                    if (registryRes.ok) {
                        const posts = await registryRes.json();
                        postMeta = posts.find(p => p.slug === postId);
                    }
                } catch (e) {
                    console.warn('Could not load posts.json registry:', e);
                }

                // 3. Fetch the Markdown file
                const markdownRes = await fetch(`posts/${postId}.md`);
                if (!markdownRes.ok) {
                    throw new Error('Markdown file not found.');
                }
                let markdownText = await markdownRes.text();

                // 4. Parse title and clean metadata headers if Gemini formatted them in Markdown
                let title = 'Wear OS Blog Post';
                
                // If metadata was defined in the registry, use it
                if (postMeta) {
                    title = postMeta.title;
                    dateEl.textContent = 'Published: ' + postMeta.date;
                    readTimeEl.textContent = postMeta.readTime || '3 min Read';
                }

                // Parse standard Markdown headers, removing the main # title from markdown body
                // to prevent duplicating the title on page
                const titleMatch = markdownText.match(/^#\s+(.*?)$/m);
                if (titleMatch) {
                    title = titleMatch[1];
                    markdownText = markdownText.replace(/^#\s+.*?$/m, ''); // remove from body
                }

                // Strip frontmatter if Gemini included it
                if (markdownText.startsWith('---')) {
                    const nextDash = markdownText.indexOf('---', 3);
                    if (nextDash !== -1) {
                        markdownText = markdownText.substring(nextDash + 3);
                    }
                }

                // Render dynamic details
                titleEl.textContent = title;
                document.title = `${title} | CreationCue™ Blog`;
                
                // Set OG Tags dynamically for social crawlers
                document.getElementById('og-title').setAttribute('content', title);
                document.getElementById('canonical-link').setAttribute('href', window.location.href);

                if (postMeta) {
                    document.getElementById('og-desc').setAttribute('content', postMeta.excerpt);
                    document.querySelector('meta[name="description"]').setAttribute('content', postMeta.excerpt);
                }

                // Parse the Markdown using Marked
                contentEl.innerHTML = marked.parse(markdownText);

                // Look for a Sources list in the markdown text and extract it if necessary
                // (Otherwise, default to a general link to the android dev blog)
                if (markdownText.toLowerCase().includes('sources:')) {
                    sourcesContainer.style.display = 'block';
                    sourcesEl.innerHTML = '<a href="https://android-developers.googleblog.com" target="_blank">Android Developers Blog</a>';
                }

            } catch (err) {
                console.error('Error rendering markdown article:', err);
                titleEl.textContent = 'Error Loading Article';
                contentEl.innerHTML = '<p>We were unable to load this article. It may have been moved or deleted.</p>';
            }
        }
    </script>
    <script src="blog-carousel.js"></script>
</body>
</html>
