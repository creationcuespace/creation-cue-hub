name: Auto-Clean Expired Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Badge Expiration Cleaner
        run: python update_new_badges.py

      - name: Commit and Push Changes (If any)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add badge_text_faces.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-clean expired NEW badges (>90 days)"
            git push
          else
            echo "No badge changes to commit."
          fi
