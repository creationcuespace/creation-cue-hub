name: Automated Blog Post Draft Generator

on:
  schedule:
    # Run twice a week: Tuesdays and Thursdays at 7:00 AM UTC (10:00 AM Greece/EEST)
    - cron: '0 7 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-blog-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run blog generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/blog-generate.js

      - name: Commit and Push Draft to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          if git status --porcelain blog/ | grep -q .; then
            echo "Changes detected in blog directory. Committing draft to main..."
            
            # Setup Git credentials
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Commit and push directly to main
            git add blog/
            git commit -m "draft: automated blog post generation"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
            
            echo "Draft successfully committed and pushed to main!"
          else
            echo "No new blog content or changes generated."
          fi
