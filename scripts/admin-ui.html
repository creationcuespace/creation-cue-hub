<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreationCue Blog Admin Dashboard</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c10;
            --surface: #1f2833;
            --primary: #f1b31c;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border: rgba(255,255,255,0.08);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; }
        h1 span { color: var(--primary); }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 30px;
        }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 24px;
        }
        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge-draft {
            background: rgba(241,179,28,0.15);
            color: var(--primary);
            border: 1px solid rgba(241,179,28,0.3);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
        .editor-toolbar { background: #2b3a4a !important; border-color: var(--border) !important; border-radius: 8px 8px 0 0 !important; }
        .editor-toolbar button { color: #fff !important; }
        .editor-toolbar button.active, .editor-toolbar button:hover { background: var(--surface) !important; }
        .CodeMirror { background: rgba(0,0,0,0.3) !important; color: #fff !important; border-color: var(--border) !important; border-radius: 0 0 8px 8px !important; }
        .CodeMirror-cursor { border-left: 2px solid #ffffff !important; }
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-edit { background: #4a90e2; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; margin-right: 6px; }
        .btn-edit:hover { background: #357abd; }
        .btn-delete { background: #ff4a4a; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-delete:hover { background: #d93838; }
        .post-list-section { margin-bottom: 24px; }
        .section-subtitle {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--border); }
        .post-list-item:last-child { border-bottom: none; }
        .post-list-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .post-list-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
        .post-list-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-list-date { font-size: 11px; color: var(--text-muted); }
        .actions-wrap { display: flex; align-items: center; }
        #status-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <h1>Creation<span>Cue</span> Blog Dashboard</h1>
        <div style="font-size:12px; color:var(--text-muted);">Local CMS Publisher</div>
    </header>

    <div class="dashboard-grid">
        <!-- Editor Panel -->
        <div class="panel">
            <div class="panel-title" id="editor-panel-title">Create Custom Article</div>
            <input type="hidden" id="original-slug" value="">
            <div class="form-group">
                <label>1. Post Title</label>
                <input type="text" id="post-title" placeholder="e.g. New Wear OS Customization Upgrades">
            </div>
            <div class="form-group">
                <label>2. Excerpt / Listing Summary</label>
                <input type="text" id="post-excerpt" placeholder="A short 1-2 sentence preview for listings.">
            </div>
            <div class="form-group">
                <label>3. Select Watch Face to Feature</label>
                <select id="post-face-select">
                    <option value="">Default Banner (ccBanner1.webp)</option>
                </select>
            </div>
            <div class="form-group" style="background:rgba(255,255,255,0.03); border:1px dashed var(--border); padding:12px; border-radius:8px; margin-bottom:15px;">
                <label style="font-size:12px; font-weight:700; margin-bottom:6px; display:block; color:var(--primary);">🔗 Add Facebook-Style Link Card</label>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                    <input type="text" id="preview-url-input" placeholder="Paste link (e.g. https://play.google.com/...)" style="margin:0; font-size:12px; flex:1;">
                    <button class="btn" style="width:auto; padding:6px 12px; font-size:12px; background:var(--surface); border:1px solid var(--border); color:#fff;" onclick="generateLinkPreview()">Fetch Metadata</button>
                </div>
                <div id="preview-card-loader" style="display:none; font-size:11px; color:var(--text-muted); margin-bottom:8px;">Fetching site info...</div>
                <div id="link-preview-box" style="display:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:8px;">
                    <div style="display:flex; gap:10px;">
                        <img id="lp-image" style="width:90px; height:90px; object-fit:cover; display:none;" src="" alt="">
                        <div style="padding:8px; overflow:hidden; flex:1; display:flex; flex-direction:column; justify-content:center;">
                            <div id="lp-title" style="font-weight:700; font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px;">Title</div>
                            <div id="lp-desc" style="font-size:11px; color:var(--text-muted); display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; overflow:hidden; line-height:1.3; margin-bottom:4px;">Description</div>
                            <div id="lp-domain" style="font-size:10px; color:var(--primary); font-weight:700; text-transform:uppercase;">DOMAIN.COM</div>
                        </div>
                    </div>
                </div>
                <button id="lp-insert-btn" class="btn" style="width:100%; font-size:12px; padding:6px; display:none;" onclick="insertLinkCardMarkdown()">Insert Card Into Article</button>
            </div>
            <div class="form-group">
                <label>4. Article Content (Rich Formatting Toolbar)</label>
                <textarea id="post-editor"></textarea>
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-bottom:15px;">
                <input type="checkbox" id="post-pinned" style="width:auto; margin:0; cursor:pointer;">
                <label for="post-pinned" style="margin:0; cursor:pointer; font-weight:normal; font-size:13px; color:#ddd; display:inline-block;">📌 Pin this article to the sidebar</label>
            </div>
            <div style="display:flex; gap:12px;">
                <button class="btn" style="flex:1;" onclick="publishPost()">Publish Live</button>
                <button class="btn" id="btn-cancel-edit" style="background:#495057; color:#fff; display:none; width:auto;" onclick="cancelEditing()">Cancel</button>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="panel" style="height:fit-content;">
            <div class="post-list-section">
                <div class="section-subtitle" style="color: var(--primary);">
                    <span>Pending AI Drafts</span>
                    <span id="drafts-count" class="badge-draft" style="display:none;">0</span>
                </div>
                <div id="drafts-list-container">
                    <div style="color:var(--text-muted); font-size:13px; padding:10px 0;">No drafts pending.</div>
                </div>
            </div>
            <div class="post-list-section">
                <div class="section-subtitle">Published Articles</div>
                <div id="posts-list-container">
                    <div style="color:var(--text-muted); font-size:13px; padding:10px 0;">Loading posts...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status overlay -->
    <div id="status-overlay">
        <div class="spinner"></div>
        <div id="status-message" style="font-size:18px; font-weight:700; font-family:'Outfit', sans-serif;">Deploying...</div>
        <div style="font-size:12px; color:var(--text-muted);">Please keep this page open. This takes around 20-30 seconds.</div>
    </div>

    <script>
        let easyMDE;

        document.addEventListener('DOMContentLoaded', function() {
            easyMDE = new EasyMDE({
                element: document.getElementById('post-editor'),
                spellChecker: false,
                autosave: { enabled: false },
                placeholder: "Write your blog post content here...",
                toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "preview", "side-by-side", "fullscreen"]
            });
            loadCatalogFaces();
            loadExistingPosts();
        });

        async function loadCatalogFaces() {
            try {
                var res = await fetch('/api/faces');
                var faces = await res.json();
                var select = document.getElementById('post-face-select');
                faces.forEach(function(f) {
                    var opt = document.createElement('option');
                    opt.value = f.image_url;
                    opt.textContent = f.title + ' (' + f.id + ')';
                    select.appendChild(opt);
                });
            } catch(e) { console.error('Error loading faces:', e); }
        }

        async function loadExistingPosts() {
            try {
                var res = await fetch('/api/posts?v=' + Date.now());
                var posts = await res.json();
                var draftsContainer = document.getElementById('drafts-list-container');
                var postsContainer = document.getElementById('posts-list-container');
                draftsContainer.innerHTML = '';
                postsContainer.innerHTML = '';

                var drafts = posts.filter(function(p) { return p.draft === true; });
                var published = posts.filter(function(p) { return p.draft !== true; });

                var countBadge = document.getElementById('drafts-count');
                if (drafts.length > 0) {
                    countBadge.textContent = drafts.length;
                    countBadge.style.display = 'inline-block';
                } else {
                    countBadge.style.display = 'none';
                }

                if (drafts.length === 0) {
                    draftsContainer.innerHTML = '<div style="color:var(--text-muted); font-size:12px; padding:6px 0;">No AI drafts pending approval.</div>';
                } else {
                    drafts.forEach(function(p) { draftsContainer.appendChild(createPostListItem(p, true)); });
                }

                if (published.length === 0) {
                    postsContainer.innerHTML = '<div style="color:var(--text-muted); font-size:12px; padding:6px 0;">No articles published yet.</div>';
                } else {
                    published.forEach(function(p) { postsContainer.appendChild(createPostListItem(p, false)); });
                }
            } catch(e) { console.error('Error loading posts:', e); }
        }

        function createPostListItem(p, isDraft) {
            var item = document.createElement('div');
            item.className = 'post-list-item';
            var thumb = p.thumbnail || 'https://raw.githubusercontent.com/creationcuespace/creation-cue-hub/main/images/ccBanner1.webp';
            var dateStr = isDraft ? '⏳ Pending Draft' : p.date;
            var safeTitle = (p.title || '').replace(/'/g, "\\'");
            var safeExcerpt = (p.excerpt || '').replace(/'/g, "\\'");
            var safeThumb = (p.thumbnail || '');
            var pinnedVal = !!p.pinned;
            var editBtn = '<button class="btn-edit" onclick="editPost(\'' + p.slug + '\',\'' + safeTitle + '\',\'' + safeExcerpt + '\',\'' + safeThumb + '\',' + isDraft + ',' + pinnedVal + ')">Edit</button>';
            var delBtn = '<button class="btn-delete" onclick="deletePost(\'' + p.slug + '\')">' + (isDraft ? 'Discard' : 'Delete') + '</button>';
            item.innerHTML = '<div class="post-list-info"><img class="post-list-thumb" src="' + thumb + '" alt="Thumb"><div style="overflow:hidden;"><div class="post-list-title" title="' + (p.title||'') + '">' + (p.title||'') + '</div><div class="post-list-date">' + dateStr + '</div></div></div><div class="actions-wrap">' + editBtn + delBtn + '</div>';
            return item;
        }

        async function editPost(slug, title, excerpt, thumbnail, isDraft, pinned) {
            showStatus('Loading article content...');
            try {
                var res = await fetch('/api/post-content?slug=' + slug + '&v=' + Date.now());
                if (!res.ok) throw new Error('Could not load markdown content');
                var content = await res.text();
                hideStatus();
                document.getElementById('original-slug').value = slug;
                document.getElementById('post-title').value = title;
                document.getElementById('post-excerpt').value = excerpt;
                document.getElementById('post-face-select').value = thumbnail;
                document.getElementById('post-pinned').checked = !!pinned;
                easyMDE.value(content);
                document.getElementById('editor-panel-title').innerHTML = isDraft
                    ? 'Review AI Draft: <span class="badge-draft">Draft</span>'
                    : 'Edit Published Article';
                document.getElementById('btn-cancel-edit').style.display = 'block';
                document.getElementById('editor-panel-title').scrollIntoView({ behavior: 'smooth' });
            } catch(e) {
                hideStatus();
                alert('Error loading article content: ' + e.message);
            }
        }

        function cancelEditing() {
            document.getElementById('original-slug').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-excerpt').value = '';
            document.getElementById('post-face-select').value = '';
            document.getElementById('post-pinned').checked = false;
            easyMDE.value('');
            document.getElementById('editor-panel-title').textContent = 'Create Custom Article';
            document.getElementById('btn-cancel-edit').style.display = 'none';
        }

        async function publishPost() {
            var originalSlug = document.getElementById('original-slug').value;
            var title = document.getElementById('post-title').value.trim();
            var excerpt = document.getElementById('post-excerpt').value.trim();
            var thumbnail = document.getElementById('post-face-select').value;
            var pinned = document.getElementById('post-pinned').checked;
            var content = easyMDE.value().trim();
            if (!title || !excerpt || !content) { alert('Please fill out all fields before publishing!'); return; }
            showStatus('Publishing and Deploying Cloud updates...');
            try {
                var res = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, excerpt: excerpt, thumbnail: thumbnail, content: content, originalSlug: originalSlug, pinned: pinned })
                });
                var result = await res.json();
                hideStatus();
                if (result.success) { alert('SUCCESS! Article published live!'); cancelEditing(); loadExistingPosts(); }
                else { alert('Error deploying updates: ' + result.error); }
            } catch(e) { hideStatus(); alert('An error occurred: ' + e.message); }
        }

        async function deletePost(slug) {
            if (!confirm('Are you sure you want to delete/discard this article permanently?')) return;
            showStatus('Deleting and Deploying Cloud updates...');
            try {
                var res = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug: slug })
                });
                var result = await res.json();
                hideStatus();
                if (result.success) { alert('SUCCESS! Article deleted!'); cancelEditing(); loadExistingPosts(); }
                else { alert('Error deploying updates: ' + result.error); }
            } catch(e) { hideStatus(); alert('An error occurred: ' + e.message); }
        }

        function showStatus(msg) {
            document.getElementById('status-message').textContent = msg;
            document.getElementById('status-overlay').style.display = 'flex';
        }
        function hideStatus() {
            document.getElementById('status-overlay').style.display = 'none';
        }

        // Link Preview Generator functions
        let currentLinkPreviewData = null;

        async function generateLinkPreview() {
            const urlInput = document.getElementById('preview-url-input');
            const url = urlInput.value.trim();
            if (!url) {
                alert('Please paste a URL first!');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('URL must start with http:// or https://');
                return;
            }

            const loader = document.getElementById('preview-card-loader');
            const previewBox = document.getElementById('link-preview-box');
            const insertBtn = document.getElementById('lp-insert-btn');

            loader.style.display = 'block';
            previewBox.style.display = 'none';
            insertBtn.style.display = 'none';
            currentLinkPreviewData = null;

            try {
                const res = await fetch('/api/link-preview?url=' + encodeURIComponent(url));
                if (!res.ok) throw new Error('Failed to fetch metadata');
                const data = await res.json();
                
                currentLinkPreviewData = data;
                
                // Show elements
                document.getElementById('lp-title').textContent = data.title || 'Visit Website';
                document.getElementById('lp-desc').textContent = data.description || 'View the shared link for more details.';
                
                let domainName = 'LINK';
                try {
                    domainName = new URL(data.url).hostname.replace('www.', '');
                } catch(e) {}
                document.getElementById('lp-domain').textContent = domainName;

                const imgEl = document.getElementById('lp-image');
                if (data.image) {
                    imgEl.src = data.image;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }

                loader.style.display = 'none';
                previewBox.style.display = 'block';
                insertBtn.style.display = 'block';
            } catch(e) {
                loader.style.display = 'none';
                alert('Could not retrieve preview data from this website. You can still paste standard links directly.');
            }
        }

        function insertLinkCardMarkdown() {
            if (!currentLinkPreviewData) return;
            
            const title = (currentLinkPreviewData.title || 'Link Preview').replace(/"/g, '&quot;');
            const desc = (currentLinkPreviewData.description || '').replace(/"/g, '&quot;');
            const image = currentLinkPreviewData.image || '';
            const url = currentLinkPreviewData.url;

            // Generate raw HTML Card string that we will parse dynamically inside post.html
            const cardHtml = `
<div class="link-preview-card" data-url="${url}" data-title="${title}" data-desc="${desc}" data-image="${image}">
  <a href="${url}" target="_blank" class="lp-card-inner">
    ${image ? `<div class="lp-card-img" style="background-image: url('${image}')"></div>` : ''}
    <div class="lp-card-info">
      <div class="lp-card-title">${currentLinkPreviewData.title || 'External Link'}</div>
      <div class="lp-card-desc">${currentLinkPreviewData.description || 'Click to view details.'}</div>
      <div class="lp-card-url">${url}</div>
    </div>
  </a>
</div>
\n`;

            // Insert into EasyMDE
            const pos = easyMDE.codemirror.getCursor();
            easyMDE.codemirror.replaceRange(cardHtml, pos);
            
            // Clean up
            document.getElementById('preview-url-input').value = '';
            document.getElementById('link-preview-box').style.display = 'none';
            document.getElementById('lp-insert-btn').style.display = 'none';
            currentLinkPreviewData = null;
        }
    </script>
</body>
</html>
